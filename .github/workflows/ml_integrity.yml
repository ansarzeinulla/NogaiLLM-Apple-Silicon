name: ML Pipeline Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 safetensors torch transformers
        
    - name: Enforce Structural Code Quality (Flake8)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Validate JSONL Schema Integrity
      run: |
        # A simple check to ensure your data engineering scripts compile
        python -m py_compile data_engineering/phase2_sft_alignment/build_sft_train.py
        python -m py_compile training_mlx/fuse_lora_weights.py